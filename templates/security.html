<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>访问密钥 · LLM Proxy</title><style>:root{color-scheme:dark;--bg:#0b1013;--panel:#141c20;--raised:#1a2328;--line:#2c3940;--text:#eef3f2;--muted:#8fa0a5;--green:#b8f36b;--cyan:#76d9df;--red:#ff8e7d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.shell{max-width:1100px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:18px}.kicker{color:var(--green);font-size:10px;letter-spacing:1.4px}h1{font:700 44px/1 Georgia,serif;margin:8px 0 0}.nav{display:flex;gap:6px;margin:14px 0}.nav a{color:var(--muted);text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:7px 10px;border-radius:4px}.nav a.active,.nav a:hover{color:#17200e;background:var(--green);border-color:var(--green)}.grid{display:grid;grid-template-columns:370px 1fr;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}.head{padding:13px 15px;border-bottom:1px solid var(--line);font-weight:700}.body{padding:15px;display:grid;gap:10px}label{display:grid;gap:5px;color:var(--muted);font-size:11px}input,button{font:inherit;color:inherit;border:1px solid var(--line);background:#090e10;padding:9px;border-radius:4px}button{cursor:pointer;background:var(--raised)}button:hover{color:var(--green);border-color:var(--green)}.primary{background:var(--green);border-color:var(--green);color:#17200e;font-weight:700}.key{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 15px;border-bottom:1px solid #222d32}.key b{color:var(--cyan)}.key small{display:block;color:var(--muted);margin-top:4px}.danger{color:var(--red)}.empty{padding:28px;color:var(--muted);text-align:center}.notice{color:var(--green)}@media(max-width:760px){.shell{padding:16px}.grid{grid-template-columns:1fr}header{align-items:start;flex-direction:column}.nav{flex-wrap:wrap}}</style></head><body><main class="shell"><header><div><div class="kicker">LLM PROXY / ACCESS CONTROL</div><h1>访问密钥</h1></div><div id="notice" class="notice">加载中...</div></header><nav class="nav"><a href="/admin">渠道管理</a><a href="/admin/mappings">模型映射</a><a href="/admin/logs">请求日志</a><a class="active" href="/admin/security">访问密钥</a><a href="/admin/logout">退出</a></nav><section class="grid"><div class="panel"><div class="head">添加共享 Key</div><form class="body" id="keyForm"><label>名称<input id="name" placeholder="例如：OpenCode"></label><label>API Key<input id="key" type="password" minlength="12" required autocomplete="new-password"></label><button type="button" onclick="generateKey()">生成随机 Key</button><button class="primary" type="submit">添加并启用</button></form></div><div class="panel"><div class="head">已配置 Key</div><div id="keys"></div></div></section></main><script>const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function notice(t,e=false){$('notice').textContent=t;$('notice').style.color=e?'var(--red)':'var(--green)'}async function api(url,o={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...o});const d=await r.json();if(!r.ok)throw new Error(d.error||r.statusText);return d}async function load(){try{const d=await api('/admin/api/security/keys');$('keys').innerHTML=d.keys.map((k,i)=>`<div class="key"><div><b>${esc(k.name)}</b><small>${esc(k.prefix)}… · ${esc(k.createdAt||'')}</small></div><button class="danger" onclick="removeKey(${i})">删除</button></div>`).join('')||'<div class="empty">未配置 Key，当前接口和 Admin 处于开放状态</div>';notice(d.enabled?'鉴权已启用':'鉴权未启用')}catch(e){notice(e.message,true)}}function generateKey(){const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);$('key').value='llmp_'+Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}async function addKey(e){e.preventDefault();try{const key=$('key').value;await api('/admin/api/security/keys',{method:'POST',body:JSON.stringify({name:$('name').value,key})});$('keyForm').reset();await load();notice('Key 已添加。请保存好明文，系统不会再次显示')}catch(e){notice(e.message,true)}}async function removeKey(i){if(!confirm('删除这把 Key？使用它的 API 客户端和登录会立即失效。'))return;try{await api(`/admin/api/security/keys/${i}`,{method:'DELETE'});await load()}catch(e){notice(e.message,true)}}$('keyForm').addEventListener('submit',addKey);load();</script></body></html>
