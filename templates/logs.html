<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>请求日志 · LLM Proxy</title>
  <style>
    :root{color-scheme:dark;--bg:#0c1114;--panel:#141b1f;--raised:#1a2328;--line:#2d3a41;--text:#edf3f2;--muted:#91a2a7;--green:#b8f36b;--cyan:#76d9df;--red:#ff8e7d;--amber:#ffc66d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--raised);padding:9px 12px;border-radius:4px}button:hover{color:var(--green);border-color:var(--green)}input,select{width:100%;background:#0b1012;border:1px solid var(--line);padding:9px;border-radius:4px}.shell{max-width:1500px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:20px}h1{margin:0;font:700 clamp(28px,4vw,48px)/1 Georgia,serif}.kicker{color:var(--green);font-size:11px;letter-spacing:1.3px;margin-bottom:8px}.nav{display:flex;gap:6px;margin:14px 0}.nav a{color:var(--muted);text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:8px 11px;border-radius:4px}.nav a:hover,.nav a.active{color:#17200e;background:var(--green);border-color:var(--green)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:var(--panel);border:1px solid var(--line);padding:12px}.stat strong{display:block;font-size:24px;color:var(--cyan)}.stat span{color:var(--muted);font-size:11px}.tools{display:grid;grid-template-columns:minmax(260px,1fr) 180px 210px auto auto;gap:8px;background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:6px 6px 0 0}.panel{border:1px solid var(--line);border-top:0;background:var(--panel);overflow:auto;max-height:calc(100vh - 300px)}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #222d32}th{position:sticky;top:0;background:#11181b;color:var(--muted);font-size:10px}.ok{color:var(--green)}.fail{color:var(--red)}.route{color:var(--cyan)}.error{max-width:300px;color:var(--amber);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{text-align:center;color:var(--muted);padding:30px}.danger{color:var(--red)}.notice{color:var(--green)}@media(max-width:850px){.shell{padding:16px}header{align-items:start;flex-direction:column}.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}.stats{grid-template-columns:1fr}}
    .error-actions{display:flex;gap:5px;margin-top:6px}.error-actions button{padding:4px 7px}.error-preview{display:block;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;width:100%;color:var(--red)}td.error{white-space:normal;overflow:visible}dialog{width:min(1100px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--panel);color:var(--text);border:1px solid var(--line);padding:16px}dialog::backdrop{background:#000b}.detail-head{display:flex;gap:10px;align-items:center;justify-content:space-between}#errorText{white-space:pre-wrap;overflow-wrap:anywhere;max-height:70vh;overflow:auto;user-select:text}
  </style>
</head>
<body><main class="shell">
  <header><div><div class="kicker">LLM PROXY / REQUEST OBSERVABILITY</div><h1>请求日志</h1></div><div id="notice" class="notice">加载中...</div></header>
  <nav class="nav"><a href="/admin">渠道管理</a><a href="/admin/mappings">模型映射</a><a class="active" href="/admin/logs">请求日志</a><a href="/admin/security">访问密钥</a><a href="/admin/logout">退出</a></nav>
  <section class="stats"><div class="stat"><strong id="total">0</strong><span>缓存记录</span></div><div class="stat"><strong id="success">0</strong><span>成功尝试</span></div><div class="stat"><strong id="error">0</strong><span>失败尝试</span></div></section>
  <section class="tools"><input id="search" placeholder="检索请求模型、渠道、上游模型、路由或错误"><select id="result"><option value="all">全部结果</option><option value="success">仅成功</option><option value="error">仅失败</option></select><select id="type"><option value="all">全部协议</option><option>openai-chat</option><option>openai-responses</option><option>claude</option><option>gemini</option></select><button onclick="loadLogs()">刷新</button><button class="danger" onclick="clearLogs()">清空日志</button></section>
  <div class="panel"><table><thead><tr><th>时间</th><th>请求模型</th><th>渠道</th><th>上游模型</th><th>结果</th><th>耗时</th><th>响应长度</th><th>路由</th><th>错误</th></tr></thead><tbody id="rows"></tbody></table></div>
</main><dialog id="errorDialog"><div class="detail-head"><strong>完整错误信息</strong><div><button onclick="copyText($('errorText').textContent)">复制全部</button><button onclick="$('errorDialog').close()" aria-label="关闭">×</button></div></div><pre id="errorText"></pre></dialog><script>
const $=id=>document.getElementById(id);let timer;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function notice(text,error=false){$('notice').textContent=text;$('notice').style.color=error?'var(--red)':'var(--green)'}
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const d=await r.json();if(!r.ok)throw new Error(d.error||r.statusText);return d}
function formatBytes(value){if(value===null||value===undefined)return '-';if(value<1024)return `${value} B`;if(value<1024*1024)return `${(value/1024).toFixed(1)} KB`;return `${(value/1024/1024).toFixed(2)} MB`}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const field=document.createElement('textarea');field.value=text;field.style.cssText='position:fixed;opacity:0';(document.querySelector('dialog[open]')||document.body).append(field);try{field.select();if(!document.execCommand('copy'))throw new Error('复制失败')}finally{field.remove()}}notice('错误信息已复制')}catch(e){notice('复制失败，请在详情中选择文本复制',true)}}
function copyError(button){return copyText(button.dataset.error)}
$('rows').addEventListener('click',e=>{const button=e.target.closest('[data-show-error]');if(button){$('errorText').textContent=button.dataset.showError;$('errorDialog').showModal()}});
const observer=new MutationObserver(()=>{$('rows').querySelectorAll('td.error').forEach(cell=>{if(cell.querySelector('.error-actions'))return;const copy=cell.querySelector('button[data-error]');if(!copy)return;const text=copy.dataset.error;cell.textContent='';const preview=document.createElement('button');preview.className='error-preview';preview.textContent=text;preview.dataset.showError=text;preview.title='点击查看完整错误';const actions=document.createElement('div');actions.className='error-actions';const show=document.createElement('button');show.textContent='全部显示';show.dataset.showError=text;actions.append(copy,show);cell.append(preview,actions)})});observer.observe($('rows'),{childList:true});
async function loadLogs(){const params=new URLSearchParams({q:$('search').value,result:$('result').value,type:$('type').value,limit:'500'});try{const data=await api('/admin/api/logs?'+params);$('total').textContent=data.total;$('success').textContent=data.success;$('error').textContent=data.error;$('rows').innerHTML=data.logs.map(item=>`<tr><td>${esc(new Date(item.timestamp).toLocaleString())}</td><td>${esc(item.requestModel)}</td><td>${esc(item.channel||'-')}</td><td>${esc(item.upstreamModel||'-')}</td><td class="${item.status<400?'ok':'fail'}">${item.status}</td><td>${item.durationMs} ms${item.stream?' · stream':''}</td><td>${formatBytes(item.responseBytes)}</td><td class="route">${esc(item.route)}</td><td class="error" title="${esc(item.error||'')}">${esc(item.error||'-')}${item.error?` <button data-error="${esc(item.error)}" onclick="copyError(this)">复制</button>`:''}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">暂无符合条件的请求记录</td></tr>';notice('日志已更新')}catch(e){notice(e.message,true)}}
async function clearLogs(){if(!confirm('清空内存和日志文件中的请求记录？'))return;try{await api('/admin/api/logs',{method:'DELETE'});await loadLogs();notice('日志已清空')}catch(e){notice(e.message,true)}}
$('search').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(loadLogs,250)});$('result').addEventListener('change',loadLogs);$('type').addEventListener('change',loadLogs);loadLogs();setInterval(()=>{if(!$('errorDialog').open)loadLogs()},5000);
</script></body></html>
