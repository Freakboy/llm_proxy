<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin 登录 · LLM Proxy</title><style>:root{color-scheme:dark;--bg:#0b1013;--panel:#141c20;--line:#2c3940;--text:#eef3f2;--muted:#8fa0a5;--green:#b8f36b;--red:#ff8e7d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.card{width:min(430px,calc(100vw - 28px));background:var(--panel);border:1px solid var(--line);padding:26px;border-radius:7px;box-shadow:0 28px 90px #000}.kicker{color:var(--green);font-size:10px;letter-spacing:1.4px}h1{font:700 38px/1 Georgia,serif;margin:9px 0 24px}label{display:grid;gap:7px;color:var(--muted)}input,button{width:100%;font:inherit;padding:11px;border-radius:4px}input{color:var(--text);background:#090e10;border:1px solid var(--line)}input:focus{outline:2px solid var(--green)}button{margin-top:12px;cursor:pointer;border:1px solid var(--green);background:var(--green);color:#17200e;font-weight:700}.error{color:var(--red);margin-bottom:12px}</style></head><body><form class="card" method="post"><div class="kicker">LLM PROXY / AUTHENTICATION</div><h1>Admin 登录</h1>{% if error %}<div class="error">{{ error }}</div>{% endif %}<label>API Key<input name="apiKey" type="password" required autofocus autocomplete="current-password"></label><button type="submit">登录控制台</button></form></body></html>
