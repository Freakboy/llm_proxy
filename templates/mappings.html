<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模型映射 · LLM Proxy</title>
  <style>
    :root{color-scheme:dark;--bg:#0c1114;--panel:#141b1f;--raised:#1a2328;--line:#2d3a41;--text:#edf3f2;--muted:#91a2a7;--green:#b8f36b;--cyan:#76d9df;--red:#ff8e7d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--raised);padding:9px 12px;border-radius:4px}button:hover{color:var(--green);border-color:var(--green)}input,select{width:100%;background:#0b1012;border:1px solid var(--line);padding:9px;border-radius:4px}.shell{max-width:1320px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:20px}h1{margin:0;font:700 clamp(28px,4vw,48px)/1 Georgia,serif}.kicker{color:var(--green);font-size:11px;letter-spacing:1.3px;margin-bottom:8px}.nav{display:flex;gap:6px;margin:14px 0}.nav a{color:var(--muted);text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:8px 11px;border-radius:4px}.nav a:hover,.nav a.active{color:#17200e;background:var(--green);border-color:var(--green)}.intro{color:var(--muted);max-width:680px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--line)}.head h2{font-size:13px;margin:0}.body{padding:14px}.mapping-row{display:grid;grid-template-columns:minmax(120px,.8fr) 1.5fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #222d32}.mapping-row:last-child{border:0}.primary{background:var(--green);border-color:var(--green);color:#17200e;font-weight:700}.danger{color:var(--red)}.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.empty{padding:28px;color:var(--muted);text-align:center}.notice{color:var(--green)}.legend{display:grid;gap:8px;margin-bottom:14px;color:var(--muted);font-size:12px}.legend b{color:var(--cyan)}@media(max-width:800px){.shell{padding:16px}.grid{grid-template-columns:1fr}header{align-items:start;flex-direction:column}.mapping-row{grid-template-columns:1fr}.mapping-row button{justify-self:start}}
    .mapping-field{display:flex;align-items:center;gap:4px;min-width:0}.mapping-field input{min-width:0}.expand-field{padding:7px;flex-shrink:0}dialog{width:calc(100vw - 28px);max-width:1100px;max-height:calc(100vh - 28px);padding:16px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px}dialog::backdrop{background:#000b}.editor-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}#mappingEditor{width:100%;height:65vh;resize:vertical;background:#0b1012;color:var(--text);font:inherit;border:1px solid var(--line);padding:12px}.editor-actions{display:flex;gap:8px;margin-top:12px}@media(max-width:520px){.mapping-row{grid-template-columns:1fr}.mapping-field{width:100%}}
  </style>
</head>
<body><main class="shell">
  <header><div><div class="kicker">LLM PROXY / MODEL ROUTING</div><h1>模型映射</h1></div><div id="notice" class="notice">加载中...</div></header>
  <nav class="nav"><a href="/admin">渠道管理</a><a class="active" href="/admin/mappings">模型映射</a><a href="/admin/logs">请求日志</a><a href="/admin/security">访问密钥</a><a href="/admin/logout">退出</a></nav>
  <p class="intro">全局映射只会分配给确实提供目标模型的渠道；渠道映射是显式覆盖，可为同一个请求模型指定该渠道专用的上游模型名。</p>
  <section class="grid">
    <div class="panel"><div class="head"><h2>全局请求模型</h2><button onclick="addRow('globalRows')">+ 添加</button></div><div class="body"><div class="legend"><span><b>请求模型</b>：客户端提交的别名</span><span><b>目标模型</b>：逗号分隔，按顺序尝试</span></div><div id="globalRows"></div><button class="primary" onclick="saveGlobal()">保存全局映射</button></div></div>
    <div class="panel"><div class="head"><h2>单渠道覆盖</h2><button onclick="addRow('channelRows')">+ 添加</button></div><div class="body"><div class="tools"><select id="channelSelect" onchange="renderChannel()"></select><button onclick="loadConfig()">重新读取</button></div><div id="channelRows"></div><button class="primary" onclick="saveChannel()">保存渠道映射</button></div></div>
  </section>
</main><dialog id="mappingEditorDialog"><div class="editor-head"><strong id="mappingEditorTitle">扩大编辑</strong><button type="button" onclick="$('mappingEditorDialog').close()" aria-label="关闭">×</button></div><textarea id="mappingEditor" spellcheck="false" aria-labelledby="mappingEditorTitle"></textarea><div class="editor-actions"><button type="button" class="primary" id="applyMappingEditor">应用</button><button type="button" onclick="$('mappingEditorDialog').close()">取消</button></div></dialog><script>
let state={channels:[],modelMap:{}};const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function notice(text,error=false){$('notice').textContent=text;$('notice').style.color=error?'var(--red)':'var(--green)'}
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const d=await r.json();if(!r.ok)throw new Error(d.error||r.statusText);return d}
async function loadConfig(){try{const previous=$('channelSelect').value;state=await api('/admin/api/config');$('channelSelect').innerHTML=state.channels.map((c,i)=>`<option value="${i}">${esc(c.name)} · ${esc(c.type)}</option>`).join('');const requested=new URLSearchParams(location.search).get('channel');const selected=previous||requested;if(selected!==null&&Number(selected)<state.channels.length)$('channelSelect').value=selected;renderRows('globalRows',state.modelMap);renderChannel();notice('配置已同步')}catch(e){notice(e.message,true)}}
function row(from='',targets=[]){return `<div class="mapping-row"><div class="mapping-field"><input class="from" value="${esc(from)}" placeholder="请求模型"><button type="button" class="expand-field" title="扩大编辑请求模型" aria-label="扩大编辑请求模型" onclick="expandMapping(this)">⛶</button></div><div class="mapping-field"><input class="to" value="${esc(targets.join(', '))}" placeholder="目标模型，逗号分隔"><button type="button" class="expand-field" title="扩大编辑目标模型" aria-label="扩大编辑目标模型" onclick="expandMapping(this)">⛶</button></div><button class="danger" onclick="this.parentElement.remove()">删除</button></div>`}
function expandMapping(button){const field=button.previousElementSibling,targets=field.classList.contains('to');$('mappingEditorTitle').textContent=targets?'目标模型 · 每行一个或逗号分隔':'请求模型';$('mappingEditor').value=targets?field.value.split(',').map(v=>v.trim()).filter(Boolean).join('\n'):field.value;$('applyMappingEditor').onclick=()=>{const value=$('mappingEditor').value;field.value=targets?value.split(/[,\r\n]+/).map(v=>v.trim()).filter(Boolean).join(', '):value.replace(/[\r\n]+/g,'').trim();field.dispatchEvent(new Event('input',{bubbles:true}));$('mappingEditorDialog').close()};$('mappingEditorDialog').showModal();$('mappingEditor').focus()}
function renderRows(id,map){$(id).innerHTML=Object.entries(map||{}).map(([from,to])=>row(from,to)).join('')||'<div class="empty">暂无映射，点击添加开始配置</div>'}
function addRow(id){if($(id).querySelector('.empty'))$(id).innerHTML='';$(id).insertAdjacentHTML('beforeend',row())}
function collect(id){const result={};$(id).querySelectorAll('.mapping-row').forEach(el=>{const from=el.querySelector('.from').value.trim();const targets=el.querySelector('.to').value.split(',').map(v=>v.trim()).filter(Boolean);if(from&&targets.length)result[from]=targets});return result}
function renderChannel(){const index=Number($('channelSelect').value||0);const channel=state.channels[index];renderRows('channelRows',channel?(channel.model_map||channel.modelMap||{}):{})}
async function saveGlobal(){try{await api('/admin/api/config',{method:'PUT',body:JSON.stringify({modelMap:collect('globalRows')})});await loadConfig();notice('全局映射已保存')}catch(e){notice(e.message,true)}}
async function saveChannel(){const index=Number($('channelSelect').value||0);try{await api(`/admin/api/channels/${index}/model-map`,{method:'PUT',body:JSON.stringify({modelMap:collect('channelRows')})});await loadConfig();$('channelSelect').value=String(index);renderChannel();notice('渠道映射已保存')}catch(e){notice(e.message,true)}}
loadConfig();
</script></body></html>
