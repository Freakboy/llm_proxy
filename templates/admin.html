<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>渠道管理 · LLM Proxy</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1013;--panel:#131a1e;--raised:#192228;--line:#2c3940;--soft:#202a30;--text:#eef3f2;--muted:#8fa0a5;--green:#b8f36b;--cyan:#76d9df;--red:#ff8e7d;--blue:#8bb7ff;--amber:#ffc66d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--raised);padding:9px 12px;border-radius:4px}button:hover:not(:disabled){color:var(--green);border-color:var(--green)}button:disabled{cursor:wait;opacity:.55}input,select,textarea{width:100%;background:#090e10;border:1px solid var(--line);border-radius:4px;padding:9px}input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px}.shell{width:100%;max-width:1920px;margin:auto;padding:22px 26px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;border-bottom:1px solid var(--line);padding-bottom:17px}h1{margin:0;font:700 clamp(28px,4vw,48px)/1 Georgia,serif}.kicker{color:var(--green);font-size:10px;letter-spacing:1.4px;margin-bottom:7px}.status{color:var(--muted);text-align:right}.status b{color:var(--green)}.nav{display:flex;gap:6px;margin:12px 0}.nav a{color:var(--muted);text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:7px 10px;border-radius:4px}.nav a.active,.nav a:hover{color:#17200e;background:var(--green);border-color:var(--green)}.stats{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:7px;margin-bottom:10px}.stat{background:var(--panel);border:1px solid var(--soft);border-left:2px solid var(--cyan);padding:9px 12px}.stat strong{font-size:21px;color:var(--cyan);margin-right:7px}.stat span{font-size:10px;color:var(--muted)}.controls{display:grid;grid-template-columns:minmax(280px,1fr) 170px 190px auto auto;gap:7px;background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:5px 5px 0 0}.primary{background:var(--green);border-color:var(--green);color:#17200e;font-weight:700}.tabs{display:flex;gap:5px;flex-wrap:wrap;background:var(--panel);border-inline:1px solid var(--line);padding:0 10px 10px}.tab{padding:5px 8px;color:var(--muted);font-size:11px}.tab.active{color:#17200e;background:var(--green);border-color:var(--green)}.progress{display:none;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--panel);border-inline:1px solid var(--line);padding:0 10px 10px;color:var(--muted);font-size:11px}.progress.show{display:grid}.track{height:5px;background:#080b0d;border:1px solid var(--soft)}.fill{width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .2s}.table-wrap{border:1px solid var(--line);background:var(--panel);overflow:auto;max-height:calc(100vh - 270px);border-radius:0 0 5px 5px}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--soft);vertical-align:middle}th{position:sticky;top:0;z-index:2;background:#10171a;color:var(--muted);font-size:10px;font-weight:400}tbody tr:hover{background:rgba(118,217,223,.035)}.name{color:var(--green);font-weight:700}.url{max-width:250px;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 7px;font-size:10px;white-space:nowrap}.pill.ok{color:var(--green);border-color:#536f35}.pill.fail{color:var(--red);border-color:#70453e}.pill.openai-chat,.pill.openai-oai{color:var(--cyan)}.pill.openai-responses{color:var(--blue)}.pill.claude{color:var(--amber)}.model-cell{max-width:370px;color:var(--cyan);font-size:11px}.model-count{color:var(--text);font-size:16px;font-weight:700;margin-right:6px}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button,.actions a{font:inherit;font-size:10px;white-space:nowrap}.actions a{color:var(--text);text-decoration:none;border:1px solid var(--line);background:var(--raised);padding:6px 8px;border-radius:4px}.actions a:hover{color:var(--green);border-color:var(--green)}.empty{text-align:center;color:var(--muted);padding:34px}
    dialog{width:min(720px,calc(100vw - 28px));max-height:calc(100vh - 28px);padding:0;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);box-shadow:0 24px 90px #000}dialog::backdrop{background:rgba(3,7,9,.78)}.dialog-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-bottom:1px solid var(--line);padding:13px 15px}.dialog-head h2{font-size:14px;margin:0}.dialog-head button{padding:5px 8px}.form{display:grid;gap:10px;padding:15px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:grid;gap:5px;color:var(--muted);font-size:11px}.hint{border:1px solid var(--soft);background:#0b1114;color:var(--muted);padding:9px 10px;border-radius:4px;font-size:11px}.hint b{color:var(--cyan)}.checkbox{display:flex;align-items:center;gap:8px}.checkbox input{width:auto}.dialog-actions{position:sticky;bottom:0;display:flex;gap:7px;background:var(--panel);border-top:1px solid var(--line);padding:12px 15px}.danger{color:var(--red)}
    @media(max-width:900px){.shell{padding:14px}.controls{grid-template-columns:1fr 1fr}.controls .search{grid-column:1/-1}.stats{grid-template-columns:repeat(2,1fr)}header{align-items:start;flex-direction:column}.status{text-align:left}.table-wrap{max-height:none}}@media(max-width:520px){.controls{grid-template-columns:1fr}.controls .search{grid-column:auto}.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
    dialog.expanded{width:calc(100vw - 28px);height:calc(100vh - 28px)}.field-tools{display:flex;justify-content:space-between;align-items:center}.field-tools button{padding:2px 7px}#largeEditor{width:100%;height:calc(100vh - 190px);resize:none}.controls{grid-template-columns:minmax(200px,1fr) repeat(2,minmax(130px,auto)) repeat(4,auto)}@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}}@media(max-width:520px){.controls{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="shell">
  <header><div><div class="kicker">LLM PROXY / ROUTING OPERATIONS</div><h1>渠道管理</h1></div><div class="status"><b>LIVE</b> · <span id="notice">加载中...</span></div></header>
  <nav class="nav"><a class="active" href="/admin">渠道管理</a><a href="/admin/mappings">模型映射</a><a href="/admin/logs">请求日志</a><a href="/admin/security">访问密钥</a><a href="/admin/logout">退出</a></nav>
  <section class="stats"><div class="stat"><strong id="channelCount">0</strong><span>渠道</span></div><div class="stat"><strong id="activeCount">0</strong><span>正常</span></div><div class="stat"><strong id="disabledCount">0</strong><span>异常</span></div><div class="stat"><strong id="modelCount">0</strong><span>模型</span></div><div class="stat"><strong id="mappingCount">0</strong><span>映射</span></div></section>
  <section class="controls"><input class="search" id="search" placeholder="检索名称、URL、备注、协议或模型"><select id="statusFilter"><option value="all">全部状态</option><option value="active">仅正常</option><option value="disabled">仅异常</option></select><select id="sortBy"><option value="weight-desc">权重：高到低</option><option value="weight-asc">权重：低到高</option><option value="models-desc">模型数：多到少</option><option value="name-asc">名称：A 到 Z</option><option value="type-asc">协议分类</option></select><button onclick="openProxy()">全局代理</button><button onclick="openNewChannel()">+ 新建渠道</button><button class="primary" id="updateAll" onclick="startRefresh()">更新全部模型</button></section>
  <div class="tabs" id="typeTabs"></div><div class="progress" id="progress"><div class="track"><div class="fill" id="progressFill"></div></div><span id="progressText"></span></div>
  <div class="table-wrap"><table><thead><tr><th>渠道</th><th>协议</th><th>状态</th><th>权重</th><th>模型能力</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>

<dialog id="channelDialog"><div class="dialog-head"><h2 id="formTitle">渠道配置</h2><button onclick="closeDialog()">×</button></div><form id="channelForm"><div class="form"><input type="hidden" id="channelIndex"><label>名称<input id="name" required></label><div class="grid2"><label>协议<select id="type"><option>openai-chat</option><option>openai-oai</option><option>openai-responses</option><option>claude</option><option>gemini</option></select></label><label>权重<input id="weight" type="number" value="0"></label></div><label>Base URL<input id="baseUrl" required placeholder="https://api.example.com"></label><label>API Key <small>留空保留现有值</small><input id="apiKey" type="password" autocomplete="new-password"></label><div class="hint" id="channelProxyState">当前代理：加载中</div><label>渠道代理 <small>留空继承全局代理；输入新值覆盖当前渠道代理</small><input id="proxy" placeholder="http://127.0.0.1:7890"></label><div class="grid2"><label>间隔秒<input id="interval" type="number" min="0" value="0"></label><label>超时秒<input id="timeout" type="number" min="1" value="20"></label></div><label>主模型，每行一个<textarea id="model" rows="3"></textarea></label><label>已探测模型，每行一个<textarea id="models" rows="6"></textarea></label><label class="checkbox"><input id="default" type="checkbox"> 默认渠道</label></div><div class="dialog-actions"><button class="primary" type="submit">保存配置</button><button type="button" id="mappingButton" onclick="openMapping()">渠道映射</button><button type="button" class="danger" onclick="deleteChannel()">删除渠道</button></div></form></dialog>

<dialog id="proxyDialog"><div class="dialog-head"><h2>全局代理</h2><button onclick="$('proxyDialog').close()">×</button></div><form id="proxyForm"><div class="form"><div class="hint" id="proxyState">当前代理：加载中</div><label>默认代理 <small>输入新值覆盖；留空保存表示保留当前配置</small><input id="globalProxy" placeholder="http://127.0.0.1:7890"></label></div><div class="dialog-actions"><button class="primary" type="submit">保存全局代理</button><button type="button" class="danger" onclick="clearProxy()">清除全局代理</button></div></form></dialog>

<dialog id="importDialog"><div class="dialog-head"><h2>粘贴内容 / sub2api / CCS 导入</h2><button type="button" onclick="$('importDialog').close()" aria-label="关闭">×</button></div><form id="importForm"><div class="form"><label>粘贴链接、JSON、环境变量或含 URL 和 API Key 的文本<textarea id="importSource" rows="6" required placeholder="Base URL: https://api.example.com&#10;API Key: sk-...&#10;&#10;也支持 CCS 导出链接、JSON、curl 请求和环境变量"></textarea></label><label>导入协议<select id="importType"><option value="auto">自动识别，无法识别时使用 OpenAI Chat</option><option value="openai-responses">Codex / openai-responses</option><option value="claude">Claude</option><option value="gemini">Gemini</option><option value="openai-chat">OpenAI Chat</option><option value="openai-oai">OpenAI OAI</option></select></label><div class="hint" id="importNotice">解析只在浏览器本地进行，不访问链接。解析后进入渠道编辑，保存后才写入配置。</div></div><div class="dialog-actions"><button class="primary" type="submit">解析并编辑</button></div></form></dialog>
<dialog id="editorDialog" class="expanded"><div class="dialog-head"><h2 id="editorTitle">扩大编辑</h2><button type="button" onclick="$('editorDialog').close()" aria-label="关闭">×</button></div><div class="form"><textarea id="largeEditor" spellcheck="false"></textarea></div><div class="dialog-actions"><button type="button" class="primary" id="applyEditor">应用</button><button type="button" onclick="$('editorDialog').close()">取消</button></div></dialog>
<script>
let state={channels:[],modelMap:{}};let selectedType='all';let activeJob=null;let lastConfigMtime=null;const $=id=>document.getElementById(id);const lines=v=>v.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function message(text,error=false){$('notice').textContent=text;$('notice').style.color=error?'var(--red)':'var(--green)'}
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const d=await r.json();if(!r.ok){const e=new Error(d.error||r.statusText);e.data=d;throw e}return d}
async function loadConfig(silent=false){try{const next=await api('/admin/api/config');state=next;lastConfigMtime=next.configMtime;render();if(!silent)message(next.configError?`配置错误：${next.configError}`:'配置已同步',!!next.configError)}catch(e){message(`加载失败：${e.message}`,true)}}
function render(){const channels=state.channels||[];$('channelCount').textContent=channels.length;$('activeCount').textContent=channels.filter(c=>c.weight>=0).length;$('disabledCount').textContent=channels.filter(c=>c.weight<0).length;$('modelCount').textContent=new Set(channels.flatMap(c=>(c.model||[]).concat(c.models||[]))).size;$('mappingCount').textContent=Object.keys(state.modelMap||{}).length;renderTabs();renderRows()}
function renderTabs(){const counts=state.channels.reduce((r,c)=>(r[c.type]=(r[c.type]||0)+1,r),{});const types=Object.keys(counts).sort();$('typeTabs').innerHTML=`<button class="tab ${selectedType==='all'?'active':''}" onclick="selectType('all')">全部 ${state.channels.length}</button>`+types.map(t=>`<button class="tab ${selectedType===t?'active':''}" onclick="selectType('${esc(t)}')">${esc(t)} ${counts[t]}</button>`).join('')}
function selectType(type){selectedType=type;renderTabs();renderRows()}
function visible(){const q=$('search').value.trim().toLowerCase(),status=$('statusFilter').value,sort=$('sortBy').value;const rows=state.channels.map((c,index)=>({...c,index})).filter(c=>(selectedType==='all'||c.type===selectedType)&&(status==='all'||(status==='active'?c.weight>=0:c.weight<0))&&(!q||[c.name,c.type,c.baseUrl,c.remark,...(c.model||[]),...(c.models||[])].join(' ').toLowerCase().includes(q)));const cmp={'weight-desc':(a,b)=>b.weight-a.weight||a.name.localeCompare(b.name),'weight-asc':(a,b)=>a.weight-b.weight||a.name.localeCompare(b.name),'models-desc':(a,b)=>(b.models||[]).length-(a.models||[]).length||b.weight-a.weight,'name-asc':(a,b)=>a.name.localeCompare(b.name,'zh-CN'),'type-asc':(a,b)=>a.type.localeCompare(b.type)||b.weight-a.weight};return rows.sort(cmp[sort])}
function renderRows(){const rows=visible();$('rows').innerHTML=rows.map(c=>{const models=c.models||[],preview=models.slice(0,4).join(' · '),extra=models.length>4?` · +${models.length-4}`:'';return `<tr><td><div class="name">${esc(c.name)}</div><div class="url" title="${esc(c.baseUrl)}">${esc(c.baseUrl)}</div></td><td><span class="pill ${esc(c.type)}">${esc(c.type)}</span></td><td><span class="pill ${c.weight>=0?'ok':'fail'}">${c.weight>=0?'正常':'异常'}</span></td><td>${c.weight}</td><td class="model-cell"><span class="model-count">${models.length}</span>${esc(preview||'未探测')}${esc(extra)}</td><td><div class="actions"><button onclick="openEdit(${c.index})">配置</button><a href="/admin/mappings?channel=${c.index}">映射</a><button onclick="startRefresh([${c.index}])">更新模型</button></div></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">没有匹配的渠道</td></tr>'}
function openNewChannel(){$('channelForm').reset();$('channelIndex').value='';$('formTitle').textContent='新建渠道';$('weight').value=0;$('interval').value=0;$('timeout').value=20;$('channelProxyState').innerHTML=`渠道专用：<b>直连</b> · 实际使用：<b>${proxyText(state.proxyInfo)}</b>`;$('mappingButton').disabled=true;$('channelDialog').showModal()}
function proxyText(info){return info?.configured?esc(info.display):'未配置（继承全局）'}
function openEdit(index){const c=state.channels[index];$('channelIndex').value=index;$('formTitle').textContent=`配置 · ${c.name}`;['name','type','baseUrl','weight','interval','timeout','proxy'].forEach(k=>$(k).value=c[k]??'');$('apiKey').value='';$('model').value=(c.model||[]).join('\n');$('models').value=(c.models||[]).join('\n');$('default').checked=!!c.default;$('channelProxyState').innerHTML=`渠道专用：<b>${proxyText(c.proxyInfo)}</b> · 实际使用：<b>${proxyText(c.effectiveProxyInfo)}</b>`;$('mappingButton').disabled=false;$('channelDialog').showModal()}
function openProxy(){$('globalProxy').value='';$('proxyState').innerHTML=state.proxyInfo?.configured?`当前全局代理：<b>${state.proxyInfo.display}</b><br>完整地址已隐藏；输入新值可覆盖。`:'当前全局代理：<b>直连</b>';$('proxyDialog').showModal()}
function closeDialog(){$('channelDialog').close()}function openMapping(){const i=$('channelIndex').value;if(i!=='')location.href=`/admin/mappings?channel=${i}`}
async function saveChannel(e){e.preventDefault();const i=$('channelIndex').value,proxy=$('proxy').value.trim(),body={name:$('name').value,type:$('type').value,baseUrl:$('baseUrl').value,apiKey:$('apiKey').value,weight:Number($('weight').value),interval:Number($('interval').value),timeout:Number($('timeout').value),model:lines($('model').value),models:lines($('models').value),default:$('default').checked};if(proxy)body.proxy=proxy;try{await api(i===''?'/admin/api/channels':`/admin/api/channels/${i}`,{method:i===''?'POST':'PUT',body:JSON.stringify(body)});closeDialog();await loadConfig();message('配置已写入 JSON 并生效')}catch(e){message(e.message,true)}}
async function saveProxy(e){e.preventDefault();try{const value=$('globalProxy').value.trim();await api('/admin/api/config',{method:'PUT',body:JSON.stringify(value?{proxy:value}:{})});$('proxyDialog').close();await loadConfig();message(value?'全局代理已保存并生效':'全局代理保持不变')}catch(e){message(e.message,true)}}
async function clearProxy(){try{await api('/admin/api/config',{method:'PUT',body:JSON.stringify({proxy:''})});$('proxyDialog').close();await loadConfig();message('全局代理已清除')}catch(e){message(e.message,true)}}
async function deleteChannel(){const i=$('channelIndex').value;if(i===''||!confirm('删除这个渠道？'))return;try{await api(`/admin/api/channels/${i}`,{method:'DELETE'});closeDialog();await loadConfig();message('渠道已删除')}catch(e){message(e.message,true)}}
async function startRefresh(indices=null){if(activeJob)return;try{const data=await api('/admin/api/model-refresh-jobs',{method:'POST',body:JSON.stringify(indices?{indices}:{})});activeJob=data.id;$('updateAll').disabled=true;$('progress').classList.add('show');pollJob()}catch(e){message(e.message,true)}}
async function pollJob(){if(!activeJob)return;try{const job=await api(`/admin/api/model-refresh-jobs/${activeJob}`);$('progressFill').style.width=`${job.total?Math.round(job.done/job.total*100):100}%`;$('progressText').textContent=`${job.done}/${job.total} · 成功 ${job.success} · 失败 ${job.failed}`;if(job.status==='completed'){activeJob=null;$('updateAll').disabled=false;await loadConfig(true);message(`模型更新完成：成功 ${job.success}，失败 ${job.failed}`,job.failed>0);setTimeout(()=>$('progress').classList.remove('show'),2000);return}setTimeout(pollJob,500)}catch(e){activeJob=null;$('updateAll').disabled=false;message(e.message,true)}}
$('channelForm').addEventListener('submit',saveChannel);$('proxyForm').addEventListener('submit',saveProxy);$('search').addEventListener('input',renderRows);$('statusFilter').addEventListener('change',renderRows);$('sortBy').addEventListener('change',renderRows);loadConfig();setInterval(()=>{if(!document.querySelector('dialog[open]')&&!activeJob)loadConfig(true)},3000);
const importButton=document.createElement('button');importButton.textContent='粘贴解析 / CCS 导入';importButton.onclick=()=>{$('importNotice').textContent='粘贴内容后点击解析，可检查 URL、API Key 并选择协议，保存后才写入配置';$('importDialog').showModal()};document.querySelector('.controls').insertBefore(importButton,$('updateAll'));
function parseImport(source,type){
  let data,version,inferred='openai-chat';const text=source.trim();
  if(text.startsWith('{'))data=JSON.parse(text);
  else{
    const links=text.match(/[a-z][a-z0-9+.-]*:\/\/[^\s<>"'`]+/gi)||[];
    const exports=links.filter(value=>{try{return new URL(value).searchParams.has('data')}catch{return false}});
    if(exports.length>1)throw new Error('检测到多个导出链接，请一次粘贴一个');
    if(exports.length){const link=new URL(exports[0]);const encoded=link.searchParams.get('data');version=link.searchParams.get('v');const base64=encoded.replace(/ /g,'+').replace(/-/g,'+').replace(/_/g,'/');data=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(base64.padEnd(Math.ceil(base64.length/4)*4,'=')),c=>c.charCodeAt(0))))}
    else{
      const urls=[...new Set(links.filter(value=>/^https?:/i.test(value)).map(value=>value.replace(/[),.;，。；）]+$/g,'')))];
      if(urls.length!==1)throw new Error(urls.length?'检测到多个 URL，请保留一个上游地址':'没有找到 http(s) URL');
      const keys=[...text.matchAll(/(?:authorization["']?\s*[:=]\s*["']?\s*bearer\s+|(?:[a-z]+[_-])*(?:api[_ -]?key|auth[_-]?token|token|key|密钥|秘钥)["']?\s*[:=：]\s*["']?)([^\s"'`;,，]+)/gi)].map(match=>match[1]);
      if(!keys.length)keys.push(...(text.match(/\bsk-[a-zA-Z0-9_-]+\b/g)||[]));
      const uniqueKeys=[...new Set(keys)];if(uniqueKeys.length!==1)throw new Error(uniqueKeys.length?'检测到多个 API Key，请保留一个':'没有找到 API Key，请用 API Key: 标注');
      data={baseUrl:urls[0],apiKey:uniqueKeys[0]};
      if(/anthropic[_-]|x-api-key/i.test(text))inferred='claude';else if(/gemini[_-]|google[_-]|x-goog-api-key/i.test(text))inferred='gemini';
    }
  }
  if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('导入内容必须是 JSON 对象');
  const fields={...data,...(data.env&&typeof data.env==='object'?data.env:{})};
  const find=names=>Object.entries(fields).find(([key,value])=>names.includes(key.toLowerCase().replace(/[^a-z]/g,''))&&typeof value==='string')?.[1];
  data={name:data.name,baseUrl:find(['baseurl','url','apibase','openaibaseurl','anthropicbaseurl','geminibaseurl']),apiKey:find(['apikey','key','token','openaiapikey','anthropicapikey','anthropicauthtoken','geminiapikey','googleapikey'])};
  if(Object.keys(fields).some(k=>/^anthropic/i.test(k)))inferred='claude';else if(Object.keys(fields).some(k=>/^(gemini|google)/i.test(k)))inferred='gemini';
  if(typeof data.baseUrl!=='string'||!/^https?:\/\//i.test(data.baseUrl))throw new Error('缺少有效的 baseUrl');
  if(typeof data.apiKey!=='string'||!data.apiKey.trim())throw new Error('缺少 apiKey');
  const address=new URL(data.baseUrl);if(!address.hostname)throw new Error('URL 无效');
  const types={'1':'openai-responses','2':'claude','3':'gemini','4':'openai-chat'};
  return {...data,type:type==='auto'?(types[version]||inferred):type};
}
$('importForm').addEventListener('submit',e=>{e.preventDefault();try{const data=parseImport($('importSource').value,$('importType').value);$('importDialog').close();openNewChannel();$('name').value=String(data.name||'Imported');$('baseUrl').value=data.baseUrl;$('apiKey').value=data.apiKey;$('type').value=data.type;$('importSource').value='';$('formTitle').textContent='导入渠道 · 检查后保存'}catch(error){$('importNotice').textContent=`解析失败：${error.message}`}});
